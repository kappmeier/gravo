name: .NET

on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Run tests, and ensure that the tests are actually executed. Enforce a passed-count floor.
      # `dotnet test` exits 0 when no tests are discovered, this check avoids it.
      # Bump both floors in the same commit that adds or removes tests.
      TEST_FLOOR: 352
      UI_TEST_FLOOR: 262
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Build solution
      run: dotnet build Gravo.sln -c Release
    - name: Smoke-run GravoCmd
      # Asserts the CLI produces real output, not just a zero exit code.
      # `tee` then `grep` necessary to avoid grep closing the pipe early
      if: runner.os == 'Linux'
      shell: bash
      run: |
        printf '1\n' | dotnet run --project GravoCmd -c Release -- voc.s3db | tee smoke.log
        grep -q "Available Groups:" smoke.log
    - name: Core tests
      # `shell: bash` enables pipefail on both runners. The passed count is extracted with
      # POSIX sed because the Windows runner's grep has no -P.
      shell: bash
      run: |
        dotnet test GravoCore.UnitTests -c Release --collect:"XPlat Code Coverage" --results-directory TestResults | tee test.log
        passed=$(sed -nE 's/.*Passed:[[:space:]]*([0-9]+).*/\1/p' test.log | tail -1)
        echo "Core tests passed: ${passed:-0} (floor: $TEST_FLOOR)"
        [ "${passed:-0}" -ge "$TEST_FLOOR" ]
    - name: UI tests
      shell: bash
      run: |
        dotnet test GravoApp.Tests -c Release --collect:"XPlat Code Coverage" --results-directory TestResults | tee ui-test.log
        passed=$(sed -nE 's/.*Passed:[[:space:]]*([0-9]+).*/\1/p' ui-test.log | tail -1)
        echo "UI tests passed: ${passed:-0} (floor: $UI_TEST_FLOOR)"
        [ "${passed:-0}" -ge "$UI_TEST_FLOOR" ]
    - name: Coverage report
      if: runner.os == 'Linux'
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.10
        reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report "-reporttypes:Html;MarkdownSummaryGithub"
        cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report
